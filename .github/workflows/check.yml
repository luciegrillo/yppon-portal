name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  api-quality:
    name: API quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yppon_portal
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_USER: yppon_ci
        options: >-
          --health-cmd "pg_isready -U yppon_ci -d yppon_portal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://yppon_ci:${{ secrets.CI_POSTGRES_PASSWORD }}@127.0.0.1:5432/yppon_portal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run db:migrate -w @yppon/api

      - name: Verify migration idempotency
        run: npm run db:migrate -w @yppon/api

      - name: Seed development data
        run: npm run db:seed -w @yppon/api

      - name: Verify seed idempotency
        run: npm run db:seed -w @yppon/api

      - name: Run API tests
        run: npm run test -w @yppon/api

      - name: Typecheck API
        run: npm run typecheck -w @yppon/api

      - name: Build API
        run: npm run build -w @yppon/api

  web-quality:
    name: Web quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck web
        run: npm run typecheck -w @yppon/web

      - name: Run web behavior tests
        run: npm run test -w @yppon/web

      - name: Build web and enforce performance budget
        run: npm run build -w @yppon/web

      - name: Install Playwright browser
        run: npm exec -w @yppon/web playwright -- install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e -w @yppon/web

  required-checks:
    name: npm run check
    if: ${{ always() }}
    needs:
      - api-quality
      - web-quality
    runs-on: ubuntu-latest

    steps:
      - name: Reject failed quality jobs
        if: >-
          needs.api-quality.result != 'success' ||
          needs.web-quality.result != 'success'
        run: exit 1

      - name: Confirm required quality jobs
        run: echo "API and web quality jobs passed."
